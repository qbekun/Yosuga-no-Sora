[preset.0]
name="Web"
platform="Web"
runnable=true
export_filter="all_resources"
include_filter="web-index/*.json,start.cfg"
exclude_filter="gdre_export.log"
export_path="../publish/game.html"

[preset.0.options]
custom_template/debug="../tools/web_nothreads_debug.zip"
custom_template/release="../tools/web_nothreads_release.zip"
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=true
html/export_icon=true
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/head_include="<script src=\"config.js\"></script><script src=\"asset-bridge.js\"></script>"
progressive_web_app/enabled=false
