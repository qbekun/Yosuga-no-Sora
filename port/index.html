<!doctype html>
<html lang="pl"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#f2f7f8">
<title>Yosuga no Sora — gra w przeglądarce</title><link rel="icon" href="game.icon.png">
<style>
:root{color-scheme:light;--paper:#f2f7f8;--ink:#214b5c;--muted:#55717c;--line:#d5e3e7;font-family:Arial,sans-serif;background:var(--paper);color:var(--ink)}*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;padding:28px}main{width:min(100%,960px,calc((100svh - 220px)*1.333333))}header{display:flex;justify-content:space-between;align-items:center;gap:20px;padding:0 2px;margin-bottom:22px}.brand h1{font:400 clamp(28px,3.2vw,40px)/1.15 Georgia,serif;letter-spacing:-.035em;margin:0}.brand p{margin:8px 0 0;font-size:13px;color:var(--muted)}.jp{font-family:Georgia,serif;font-size:15px;letter-spacing:.22em;margin:0;color:var(--muted)}
.stage{position:relative;isolation:isolate;aspect-ratio:4/3;overflow:hidden;border-radius:12px;background:#b5d3dc url('sky.png') center/cover no-repeat;box-shadow:0 18px 60px #214b5c12,0 0 0 1px #214b5c0a}.welcome{position:absolute;inset:auto 0 0;padding:clamp(24px,4vw,42px);display:flex;align-items:center;justify-content:space-between;gap:24px;background:linear-gradient(0deg,#fff 0%,#ffffffed 65%,#ffffff00 100%)}.welcome h2{font:400 clamp(24px,3vw,34px)/1.2 Georgia,serif;letter-spacing:-.025em;margin:22px 0 10px}.welcome p{font-size:14px;line-height:1.6;color:var(--muted);margin:0;max-width:36ch}button{cursor:pointer;font:500 14px/1.2 Arial,sans-serif;min-height:48px;border:0;border-radius:6px;transition:background .18s,box-shadow .18s}#play{flex-shrink:0;display:flex;align-items:center;justify-content:center;gap:12px;padding:17px 24px;color:#fff;background:var(--ink);box-shadow:0 4px 12px #214b5c1c}#play:hover{background:#163b4b;box-shadow:0 5px 18px #214b5c2c}#play:disabled{cursor:wait;opacity:.7}button:focus-visible{outline:3px solid #317da0;outline-offset:5px}svg{width:16px;height:16px;flex-shrink:0}iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000}.stage.is-playing{background:#000}.stage:fullscreen{width:100vw;height:100vh;border-radius:0;aspect-ratio:auto}#status:empty{display:none}#status{position:absolute;bottom:12px;left:42px;right:42px;font-size:13px;color:var(--ink);margin:0}.welcome:has(#status:not(:empty)){padding-bottom:52px}
footer{padding:20px 2px 0;display:flex;justify-content:space-between;align-items:flex-start;gap:16px;color:var(--muted);font-size:12px;line-height:1.7}.keys{display:flex;gap:16px;flex-wrap:wrap}.keys span{white-space:nowrap}kbd{display:inline-block;min-width:23px;padding:1px 5px;margin-right:4px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;background:#ffffff85;font:11px/1.6 Arial,sans-serif;color:var(--ink)}.save-note{margin:0;text-align:right}#fullscreen{display:flex;align-items:center;gap:8px;background:transparent;color:var(--ink);padding:8px 12px;border:1px solid var(--line);min-height:44px}#fullscreen:hover{background:#fff}#fullscreen[hidden]{display:none}
@media(max-width:640px){body{padding:24px 16px;align-items:start}main{width:100%;margin:18px auto}header{margin-bottom:20px}.brand h1{font-size:31px}.jp{font-size:11px;letter-spacing:.1em}.brand p{font-size:12px}.welcome{padding:18px;display:block}.welcome h2{margin:22px 0 6px;font-size:25px}.welcome p{font-size:12px}#play{margin-top:14px;width:100%;min-height:46px;padding:13px 20px}.stage{border-radius:9px}.welcome:has(#status:not(:empty)){padding-bottom:62px}#status{left:18px;right:18px;bottom:14px;font-size:12px}footer{display:block;padding-top:18px}.keys{gap:8px 16px}.save-note{text-align:left;margin-top:12px}#fullscreen{font-size:12px;padding:8px}.jp:has(+button:not([hidden])){display:none}}
@media(prefers-reduced-motion:reduce){button{transition:none}}
</style></head><body><main>
<header><div class="brand"><h1>Yosuga no Sora</h1><p>Wersja przeglądarkowa</p></div><p class="jp" lang="ja">ヨスガノソラ</p><button id="fullscreen" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/></svg>Pełny ekran</button></header>
<section class="stage" id="stage" aria-label="Gra Yosuga no Sora"><div class="welcome"><div><h2>Wróć do Okukozome.</h2><p>Twoja historia pod tym samym niebem.</p></div><button id="play"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4v16l14-8z"/></svg><span>Rozpocznij grę</span></button><p id="status" role="status" aria-live="polite"></p></div></section>
<footer><div class="keys" aria-label="Sterowanie"><span><kbd>Enter</kbd> lub kliknięcie — dalej</span><span><kbd>S</kbd> pomijanie</span><span><kbd>A</kbd> tryb auto</span></div><p class="save-note">Postęp pozostaje w tej przeglądarce.</p></footer>
</main><script src="config.js"></script><script>
const play=document.getElementById('play'),stage=document.getElementById('stage'),fullscreen=document.getElementById('fullscreen');
fullscreen.onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await stage.requestFullscreen()}catch{document.querySelector('iframe')?.focus()}};
play.onclick=async()=>{const status=document.getElementById('status');play.disabled=true;status.textContent='Przygotowywanie gry…';try{const base=localStorage.getItem('yosuga-assets-url')||window.YOSUGA_ASSET_BASE||'../release-assets/';const url=new URL(base,location.href);if(!url.pathname.endsWith('/'))url.pathname+='/';const response=await fetch(new URL('manifest.json',url));if(!response.ok)throw Error('HTTP '+response.status);const manifest=await response.json();if(!manifest.files)throw Error('Niepoprawny katalog danych');const frame=document.createElement('iframe');frame.title='Yosuga no Sora';frame.allow='autoplay; fullscreen';frame.allowFullscreen=true;frame.src='game.html';stage.classList.add('is-playing');stage.replaceChildren(frame);fullscreen.hidden=!document.fullscreenEnabled;frame.focus()}catch(error){status.textContent='Nie udało się pobrać danych gry. Spróbuj ponownie za chwilę.';play.disabled=false;console.error(error)}};
</script></body></html>
